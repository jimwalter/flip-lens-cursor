<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FlipLens → Google Lens</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #333;
        background: #fafafa;
      }
      .box {
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 14px;
        border: 3px solid #dcdcdc;
        border-top-color: #4f8cff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div id="status">Opening Google Lens with your capture…</div>
    </div>
    <script src="uploader.js"></script>
  </body>
</html>
